[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "run-dig"
version = "0.2.0"
description = "Recover ML experiment metadata and infer lineage from existing files."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0", "tomli>=1.1.0; python_version < '3.11'"]

[project.scripts]
run-dig = "rundig.cli:main"

[project.urls]
Repository = "https://github.com/cz0211wyx/run-dig"
Issues = "https://github.com/cz0211wyx/run-dig/issues"

[tool.setuptools.packages.find]
include = ["rundig*"]

[tool.setuptools.package-data]
rundig = ["viewer.html"]
