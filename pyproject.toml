[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "run-shelf"
version = "0.2.0"
description = "Recover experiment metadata and evidence-backed lineage from messy ML directories."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0"]

[project.scripts]
run-shelf = "runshelf.cli:main"

[tool.setuptools.packages.find]
include = ["runshelf*"]

[tool.setuptools.package-data]
runshelf = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
