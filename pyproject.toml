[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "run-dig"
version = "0.2.0"
description = "Find experiments and trace their relationships."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0"]

[project.scripts]
run-dig = "rundig.cli:main"

[tool.setuptools.packages.find]
include = ["rundig*"]

[tool.setuptools.package-data]
rundig = ["viewer.html"]
