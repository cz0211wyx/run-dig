name: publish
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from rundig import __version__

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert version == __version__, 'Package versions must match'
          assert os.environ['RELEASE_REF'] == f'refs/tags/v{version}', 'Run this workflow on the matching release tag'
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install dist/*.whl
      - name: Test the installed package
        working-directory: ${{ runner.temp }}
        run: |
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          python "$GITHUB_WORKSPACE/examples/create_demo.py" demo-experiments
          run-dig scan demo-experiments -o report
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/run-dig
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
