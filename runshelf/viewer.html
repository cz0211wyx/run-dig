<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>run-shelf · Experiment archaeology</title>
<style>
:root{--ink:#172c30;--muted:#657779;--border:#dce5df;--paper:#fbfcf8;--green:#246d53;--amber:#ad7434;--blue:#48789b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button{padding:8px 12px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--ink)}button:hover{background:#eef4ed}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--border);gap:20px;background:white}.brand{font-size:24px;font-weight:750;letter-spacing:-1px}.brand span{color:var(--green)}.eyebrow{text-transform:uppercase;letter-spacing:1.6px;font-size:10px;font-weight:700;color:var(--muted)}.subtitle{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;align-items:center}.stats{display:flex;gap:0;padding:20px 28px;border-bottom:1px solid var(--border);background:#f2f5ed}.stat{padding-right:45px}.stat b{display:block;font-size:27px;font-weight:600;line-height:1.2}.stat span{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.shell{display:grid;grid-template-columns:260px minmax(400px,1fr) 340px;height:calc(100vh - 192px);min-height:620px}.sidebar{border-right:1px solid var(--border);padding:20px 14px;overflow:auto;background:white}.sidebar h2{font-size:14px;margin:0 0 12px}.search{width:100%;padding:10px;border:1px solid var(--border);border-radius:7px;margin-bottom:10px}.node-list{display:flex;flex-direction:column;gap:4px;margin-top:12px}.node-item{text-align:left;border:1px solid transparent;padding:9px 10px;background:transparent;overflow:hidden}.node-item.active{border-color:#7ba28b;background:#edf4ed}.node-item strong{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.node-item small{display:block;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{border-radius:4px;padding:2px 5px;font-size:10px;background:#edf3ed;color:var(--green)}.tag.uncertain{background:#fff0d9;color:#805818}.workspace{min-width:0;min-height:0;display:flex;flex-direction:column}.toolbar{padding:14px 18px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--border);background:#fff;flex-wrap:wrap}.toolbar label{font-size:11px;display:flex;gap:5px;align-items:center}.toolbar input[type=range]{width:90px;accent-color:var(--green)}select{border:1px solid var(--border);border-radius:5px;background:white;padding:6px;max-width:230px}.legend{display:flex;gap:13px;padding:9px 18px;flex-wrap:wrap;color:var(--muted);font-size:10px}.legend label{display:flex;align-items:center;gap:3px}.legend input{accent-color:var(--green)}.graph-wrap{position:relative;flex:1;overflow:hidden;background-color:#f8faf5;background-image:radial-gradient(#d9e2d7 .8px,transparent .8px);background-size:20px 20px;min-height:420px}svg{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}svg.dragging{cursor:grabbing}.graph-note{position:absolute;bottom:13px;left:16px;right:16px;pointer-events:none;color:var(--muted);font-size:11px;background:#f8faf5dd;padding:6px;border-radius:4px}.inspector{padding:20px;overflow:auto;border-left:1px solid var(--border);background:white}.inspector h2{margin:3px 0 8px;font-size:18px;word-break:break-word}.inspector h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:22px 0 9px;color:var(--muted)}.inspector p{font-size:12px}.path{color:var(--muted);font:11px/1.6 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.details-grid div{padding:10px;background:#f4f6f1;border-radius:6px;font-size:11px}.details-grid b{display:block;font-size:15px}.notice{font-size:12px;background:#fff6e7;color:#785722;padding:10px 12px;border:1px solid #ebd9b5;border-radius:6px;margin:12px 0}.relation{display:block;width:100%;text-align:left;margin:6px 0;font-size:12px;overflow-wrap:anywhere}.facts{width:100%;border-collapse:collapse;font-size:11px}.facts td{border-bottom:1px solid #edf0eb;padding:7px 2px;vertical-align:top;overflow-wrap:anywhere}.facts td:first-child{width:46%;color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;font:10px/1.6 ui-monospace,Consolas,monospace;background:#f5f7f2;padding:10px;border-radius:5px}details{font-size:12px;margin-top:12px}summary{cursor:pointer}.edge{fill:none;cursor:pointer;pointer-events:stroke}.graph-node{cursor:pointer}.graph-node text{pointer-events:none}.graph-node:focus{outline:none}.graph-node:focus rect{stroke-width:3}.empty{padding:30px 8px;color:var(--muted);font-size:13px}.linklike{color:var(--green)}.full-panel{position:fixed;inset:10% 12%;overflow:auto;padding:28px;border:1px solid var(--border);box-shadow:0 20px 90px #172c3030;background:white;border-radius:12px;z-index:5}.full-panel[hidden]{display:none}.close{float:right}.mobile-note{display:none}
@media(max-width:1100px){.shell{grid-template-columns:210px minmax(350px,1fr)}.inspector{grid-column:1/-1;border-top:1px solid var(--border);max-height:600px}.shell{height:auto}.workspace{height:650px}.stat{padding-right:25px}.sidebar{max-height:650px}}@media(max-width:650px){header{padding:16px;align-items:flex-start}.subtitle{max-width:180px}.stats{padding:16px;flex-wrap:wrap;gap:15px}.stat b{font-size:22px}.shell{display:flex;flex-direction:column}.sidebar{max-height:220px}.node-list{display:grid;grid-template-columns:1fr 1fr}.workspace{height:600px}.full-panel{inset:4%}.actions{flex-direction:column}}
</style>
</head>
<body>
<header><div><div class="brand">run<span>-</span>shelf<span>.</span></div><div class="subtitle">Experiment archaeology · Local, evidence-backed exploration</div></div><div class="actions"><span class="eyebrow">Lineage explorer</span><button id="audit">Scan notes</button><button id="download">Export JSON ↓</button></div></header>
<section class="stats" id="stats" aria-label="Scan statistics"></section>
<main class="shell">
<aside class="sidebar"><h2>Experiments & candidates</h2><input id="search" class="search" type="search" placeholder="Search names, paths, config…" aria-label="Search experiments"><select id="node-kind" aria-label="Node type"><option value="all">All nodes</option><option value="experiment">Experiments only</option><option value="checkpoint_candidate">Uncertain candidates only</option></select><div id="list-count" class="subtitle" style="margin-top:10px"></div><div id="node-list" class="node-list"></div></aside>
<section class="workspace" aria-label="Experiment graph">
<div class="toolbar"><label>Min. edge confidence <input id="confidence" type="range" min="0" max="1" step="0.05" value="0.6"><output id="confidence-value">0.60</output></label><button id="fit">Fit graph</button><button id="focus">Focus selected</button><button id="reset">Reset</button></div>
<div class="legend" id="legend"></div>
<div class="graph-wrap"><svg id="graph" aria-label="Interactive experiment lineage graph" role="img"></svg><div id="graph-note" class="graph-note"></div></div>
</section>
<aside class="inspector" id="inspector" aria-live="polite"></aside>
</main>
<section class="full-panel" id="notes" hidden><button class="close" id="close-notes">Close</button><h2>Scan notes & assumptions</h2><div id="notes-body"></div></section>
<script>
"use strict";
const REPORT = __REPORT_DATA__;
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const kinds = {
  derived_from: {label:'Explicit derivation',color:'#246d53',dash:''},
  references: {label:'Checkpoint reference',color:'#48789b',dash:''},
  same_artifact: {label:'Identical artifact',color:'#8c64a8',dash:'3 3'},
  possible_derivation: {label:'Possible derivation',color:'#b57a33',dash:'7 4'},
  similar_to: {label:'Similarity only',color:'#9a9c91',dash:'2 5'}
};
const nodes = REPORT.experiments, edges = REPORT.edges;
const byId = new Map(nodes.map(n=>[n.id,n]));
const artifacts = new Map(REPORT.artifacts.map(a=>[a.id,a]));
let selected = null, focused = false, enabled = new Set(Object.keys(kinds));
let box = [0,0,1000,700], fitBox = box.slice(), drag = null, moved = false;
function el(tag, text, cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function sv(tag, attrs={}){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n;}
function bytes(n){for(const unit of ['B','KB','MB','GB','TB']){if(n<1000||unit==='TB')return `${Number(n.toFixed(1))}${unit}`;n/=1000;}}
function time(n){return n===null?'Unknown':new Date(n*1000).toLocaleString();}
function pre(parent,title,value){const d=el('details'),s=el('summary',title);d.append(s,el('pre',JSON.stringify(value,null,2)));parent.append(d);}
function heading(parent,text){parent.append(el('h3',text));}
function notice(parent,text){parent.append(el('div',text,'notice'));}
for(const [label,value] of [['Experiments',REPORT.statistics.anchored_experiments],['Uncertain candidates',REPORT.statistics.checkpoint_candidates],['Checkpoints',REPORT.statistics.checkpoints],['Relationships',edges.length],['Checkpoint size',bytes(REPORT.statistics.checkpoint_bytes)]]){
 const s=el('div',undefined,'stat');s.append(el('b',String(value)),el('span',label));$('stats').append(s);
}
for(const [kind,style] of Object.entries(kinds)){
 const label=el('label'),input=el('input');input.type='checkbox';input.checked=true;input.dataset.kind=kind;input.setAttribute('aria-label',style.label);label.style.color=style.color;
 label.append(input,document.createTextNode(style.label));input.onchange=()=>{input.checked?enabled.add(kind):enabled.delete(kind);render();};$('legend').append(label);
}
const searchable=new Map(nodes.map(n=>[n.id,`${n.name} ${n.path} ${JSON.stringify(n.config)}`.toLowerCase()]));
function eligibleEdges(){const minimum=Number($('confidence').value);return edges.filter(e=>enabled.has(e.kind)&&e.confidence>=minimum);}
function filtered(){const query=$('search').value.toLowerCase(),kind=$('node-kind').value;return nodes.filter(n=>searchable.get(n.id).includes(query)&&(kind==='all'||n.kind===kind));}
function selectNode(id){selected=id;showNode(byId.get(id));render(focused);}
function showWelcome(){const p=$('inspector');p.replaceChildren();p.append(el('div','Reconstruct, then inspect','eyebrow'),el('h2','Follow the evidence'),el('p','Select an experiment to inspect recovered configuration, metrics, files, and relationships. Select an edge to see why it exists.'));notice(p,'Arrows describe explicit references or tentative chronology. Similarity and identical bytes are undirected; they do not establish ancestry.');p.append(el('p','Scroll to zoom, drag to pan. Search or use Focus selected to isolate a neighborhood. Confidence scores are heuristic, not probabilities.'));heading(p,'Scan root');p.append(el('div',REPORT.root,'path'));if(REPORT.statistics.partial)notice(p,'This scan is partial. Open Scan notes for details.');if(!nodes.length)p.append(el('p','No experiment candidates found. Check exclusions, scan scope, or provide configs/logs alongside checkpoints.'));}
function showNode(n){if(!n)return;const p=$('inspector');p.replaceChildren();p.append(el('div',n.kind==='experiment'?'Recovered experiment':'Uncertain checkpoint candidate','eyebrow'),el('h2',n.name),el('div',n.path,'path'));const grid=el('div',undefined,'details-grid');for(const [label,value] of [['Identification',`${Math.round(n.confidence*100)}%`],['Checkpoints',n.checkpoint_count],['Size',bytes(n.checkpoint_bytes)],['Last modified',time(n.modified)]]){const d=el('div',label);d.append(el('b',String(value)));grid.append(d);}p.append(grid);if(n.kind!=='experiment')notice(p,'Run identity is unknown. This may be a saved epoch, an export, a copy, or a separate experiment.');heading(p,'Identification evidence');for(const item of n.evidence)p.append(el('p',item));if(n.started!==null){p.append(el('p',`Recorded start: ${time(n.started)}`));}heading(p,'Relationships');const connected=edges.filter(e=>e.source===n.id||e.target===n.id);if(!connected.length)p.append(el('p','No supported relationship found. This node remains isolated.'));for(const e of connected){const other=byId.get(e.source===n.id?e.target:e.source);const b=el('button',`${kinds[e.kind].label} · ${Math.round(e.confidence*100)}%\n${other.name}`,'relation');b.onclick=()=>showEdge(e);p.append(b);}heading(p,'Configuration');const table=el('table',undefined,'facts');for(const [key,value] of Object.entries(n.config).slice(0,35)){const row=el('tr');row.append(el('td',key),el('td',typeof value==='object'?JSON.stringify(value):String(value)));table.append(row);}p.append(table);pre(p,`All configuration and sources (${Object.keys(n.config).length} fields)`,n.config_sources);pre(p,`Metrics (${Object.keys(n.metrics).length})`,{values:n.metrics,sources:n.metric_sources});pre(p,`Artifacts (${n.artifacts.length})`,n.artifacts.map(id=>{const a=artifacts.get(id);return {path:a.path,kind:a.kind,size:a.size,sha256:a.sha256,warnings:a.warnings};}));pre(p,'References and resolution',n.references);pre(p,'Recorded time sources',n.time_sources);if(n.warnings.length)pre(p,`Warnings (${n.warnings.length})`,n.warnings);}
function showEdge(e){const p=$('inspector');p.replaceChildren();p.append(el('div','Relationship evidence','eyebrow'),el('h2',kinds[e.kind].label),el('p',`${Math.round(e.confidence*100)}% confidence · ${e.directed?'Directed':'Undirected'}`));for(const id of [e.source,e.target]){const b=el('button',byId.get(id).path,'relation');b.onclick=()=>selectNode(id);p.append(b);}for(const text of e.caveats)notice(p,text);heading(p,'Why this edge exists');for(const fact of e.evidence){p.append(el('p',fact.signal));pre(p,'Inspect source evidence',fact);}if(Object.keys(e.changes).length)pre(p,'Configuration changes (source → target)',e.changes);}
function updateBox(){ $('graph').setAttribute('viewBox',box.join(' ')); }
function render(refit=true){
 const all=filtered();let graphNodes=all;if(focused&&selected){const neighborhood=new Set([selected]);for(const e of eligibleEdges())if(e.source===selected||e.target===selected){neighborhood.add(e.source);neighborhood.add(e.target);}graphNodes=all.filter(n=>neighborhood.has(n.id));}const visible=graphNodes.slice(0,250),ids=new Set(visible.map(n=>n.id)),visibleEdges=eligibleEdges().filter(e=>ids.has(e.source)&&ids.has(e.target));
 $('list-count').textContent=`${all.length} matching nodes${focused?' · focused neighborhood':''}`;$('node-list').replaceChildren();
 for(const n of all){const b=el('button',undefined,`node-item${selected===n.id?' active':''}`);b.append(el('strong',n.name),el('small',n.path));b.title=n.path;b.onclick=()=>selectNode(n.id);$('node-list').append(b);}
 const svg=$('graph');svg.replaceChildren();const defs=sv('defs');for(const [kind,style] of Object.entries(kinds)){const marker=sv('marker',{id:`arrow-${kind}`,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(sv('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:style.color}));defs.append(marker);}svg.append(defs);
 const adjacency=new Map(visible.map(n=>[n.id,new Set()]));for(const e of visibleEdges){adjacency.get(e.source).add(e.target);adjacency.get(e.target).add(e.source);}
 const components=[],seen=new Set();for(const n of visible){if(seen.has(n.id))continue;const queue=[n.id],component=[];seen.add(n.id);for(let i=0;i<queue.length;i++){const id=queue[i];component.push(id);for(const other of adjacency.get(id))if(!seen.has(other)){seen.add(other);queue.push(other);}}components.push(component);}components.sort((a,b)=>b.length-a.length);
 const positions=new Map();
 const rowWidth=Math.max(1100,Math.ceil(Math.sqrt(visible.length))*240);
 let cursorX=40,cursorY=40,rowHeight=0,maxX=800,maxY=350;
 for(const component of components){
   const componentSet=new Set(component),indegree=new Map(component.map(id=>[id,0]));
   for(const e of visibleEdges)if(e.directed&&componentSet.has(e.source))indegree.set(e.target,indegree.get(e.target)+1);
   const roots=component.filter(id=>indegree.get(id)===0),levels=new Map();
   const queue=[[roots.length?roots[0]:component[0],0]];
   for(let i=0;i<queue.length;i++){const [id,depth]=queue[i];if(levels.has(id))continue;levels.set(id,depth);for(const other of adjacency.get(id))if(!levels.has(other))queue.push([other,depth+1]);}
   const columns=new Map();for(const id of component){const depth=levels.get(id)||0;if(!columns.has(depth))columns.set(depth,[]);columns.get(depth).push(id);}
   const width=columns.size*305-65,height=Math.max(...[...columns.values()].map(column=>column.length))*92;
   if(cursorX>40&&cursorX+width>rowWidth){cursorX=40;cursorY+=rowHeight+50;rowHeight=0;}
   for(const [depth,column] of columns)for(let i=0;i<column.length;i++)positions.set(column[i],[cursorX+depth*305,cursorY+i*92]);
   maxX=Math.max(maxX,cursorX+width);maxY=Math.max(maxY,cursorY+height);
   cursorX+=width+65;rowHeight=Math.max(rowHeight,height);
 }
 const lineLayer=sv('g');for(const e of visibleEdges){const [sx,sy]=positions.get(e.source),[tx,ty]=positions.get(e.target),right=tx>=sx;const x1=sx+(right?240:0),x2=tx+(right?0:240),y1=sy+28,y2=ty+28;const style=kinds[e.kind],active=selected&&(e.source===selected||e.target===selected);const path=sv('path',{d:`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`,stroke:style.color,'stroke-width':active?3:1.8,'stroke-dasharray':style.dash,opacity:selected&&!active?.25:.8,class:'edge'});if(e.directed)path.setAttribute('marker-end',`url(#arrow-${e.kind})`);const title=sv('title');title.textContent=`${style.label} · ${Math.round(e.confidence*100)}%`;path.append(title);const hit=sv('path',{d:path.getAttribute('d'),stroke:'transparent','stroke-width':14,fill:'none',class:'edge-hit',style:'cursor:pointer;pointer-events:stroke',tabindex:0,role:'button','aria-label':style.label});hit.addEventListener('click',()=>{if(!moved)showEdge(e);});hit.addEventListener('keydown',event=>{if(event.key==='Enter')showEdge(e);});lineLayer.append(path,hit);}svg.append(lineLayer);
 for(const n of visible){const [x,py]=positions.get(n.id),active=n.id===selected;const group=sv('g',{transform:`translate(${x} ${py})`,class:'graph-node',tabindex:0,role:'button','aria-label':n.path});const rect=sv('rect',{width:240,height:57,rx:8,fill:active?'#e4efdf':'#ffffff',stroke:active?'#246d53':n.kind==='experiment'?'#b7cdbd':'#c8b28b','stroke-width':active?2:1,'stroke-dasharray':n.kind==='experiment'?'':'4 3'});const name=sv('text',{x:12,y:23,fill:'#172c30','font-size':12,'font-weight':600});name.textContent=n.name.length>31?n.name.slice(0,28)+'…':n.name;const sub=sv('text',{x:12,y:42,fill:'#657779','font-size':10});sub.textContent=`${n.checkpoint_count} checkpoints · ${bytes(n.checkpoint_bytes)} · ${Math.round(n.confidence*100)}% ID`;const title=sv('title');title.textContent=n.path;group.append(rect,name,sub,title);group.onclick=()=>{if(!moved)selectNode(n.id);};group.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(n.id);}};svg.append(group);}
 fitBox=[0,0,maxX+40,maxY+40];if(refit){box=fitBox.slice();updateBox();}
 $('graph-note').textContent=visible.length?`${visible.length} nodes · ${visibleEdges.length} visible edges · scroll to zoom, drag to pan${graphNodes.length>250?' · graph limited to 250 nodes; search to narrow results':''}${focused?' · focused neighborhood':''}`:'No matching nodes. Clear filters or inspect Scan notes.';
 $('focus').textContent=focused?'Show all nodes':'Focus selected';
}
$('search').oninput=()=>render();$('node-kind').onchange=()=>render();$('confidence').oninput=()=>{$('confidence-value').textContent=Number($('confidence').value).toFixed(2);render();};
$('fit').onclick=()=>{box=fitBox.slice();updateBox();};$('focus').onclick=()=>{if(selected){focused=!focused;render();}else{$('graph-note').textContent='Select a node first, then focus its neighborhood.';}};
$('reset').onclick=()=>{$('search').value='';$('node-kind').value='all';$('confidence').value='.6';$('confidence-value').textContent='0.60';enabled=new Set(Object.keys(kinds));document.querySelectorAll('#legend input').forEach(i=>i.checked=true);selected=null;focused=false;showWelcome();render();};
$('graph').addEventListener('wheel',e=>{e.preventDefault();const rect=$('graph').getBoundingClientRect(),factor=e.deltaY>0?1.15:1/1.15;if(box[2]*factor<120||box[2]*factor>100000)return;const px=(e.clientX-rect.left)/rect.width,py=(e.clientY-rect.top)/rect.height;box=[box[0]+box[2]*px*(1-factor),box[1]+box[3]*py*(1-factor),box[2]*factor,box[3]*factor];updateBox();},{passive:false});
$('graph').addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,box.slice()];moved=false;$('graph').classList.add('dragging');});
window.addEventListener('pointermove',e=>{if(!drag)return;const rect=$('graph').getBoundingClientRect(),dx=e.clientX-drag[0],dy=e.clientY-drag[1];if(Math.abs(dx)+Math.abs(dy)>4)moved=true;const scale=Math.max(drag[2][2]/rect.width,drag[2][3]/rect.height);box=[drag[2][0]-dx*scale,drag[2][1]-dy*scale,drag[2][2],drag[2][3]];updateBox();});window.addEventListener('pointerup',()=>{drag=null;$('graph').classList.remove('dragging');});
$('audit').onclick=()=>{$('notes').hidden=false;};$('close-notes').onclick=()=>{$('notes').hidden=true;};window.addEventListener('keydown',e=>{if(e.key==='Escape')$('notes').hidden=true;});
const notes=$('notes-body');notes.append(el('div',REPORT.root,'path'),el('p',`Generated ${REPORT.generated_at} · run-shelf ${REPORT.tool_version} · schema ${REPORT.schema_version}`));for(const assumption of REPORT.assumptions)notes.append(el('p',assumption));pre(notes,'Scan statistics',REPORT.statistics);pre(notes,'Limits and exclusions',REPORT.options);pre(notes,`File warnings (${REPORT.warnings.length})`,REPORT.warnings);const unresolved=nodes.flatMap(n=>n.references.filter(r=>['unresolved','ambiguous'].includes(r.resolution)).map(r=>({experiment:n.path,...r})));pre(notes,`Unresolved or ambiguous references (${unresolved.length})`,unresolved);
$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(REPORT,null,2)],{type:'application/json'})),a=el('a');a.href=url;a.download='run-shelf-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
if(nodes.length>30){const degree=new Map(nodes.map(n=>[n.id,0]));for(const e of edges){const weight=e.directed?4:1;degree.set(e.source,degree.get(e.source)+weight);degree.set(e.target,degree.get(e.target)+weight);}selected=[...nodes].sort((a,b)=>(degree.get(b.id)+(b.checkpoint_count?2:0))-(degree.get(a.id)+(a.checkpoint_count?2:0)))[0].id;focused=true;showNode(byId.get(selected));}else{showWelcome();}render();
</script>
</body>
</html>
