<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>run-shelf</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; color: #24292f; background: #fff; font: 14px/1.6 system-ui, sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 32px 28px; }
header { border-bottom: 1px solid #e5e7eb; padding-bottom: 18px; margin-bottom: 28px; }
h1 { font-size: 22px; margin: 0 0 6px; }
h2 { font-size: 19px; margin: 0 0 6px; overflow-wrap: anywhere; }
h3 { font-size: 15px; margin: 28px 0 8px; }
p { margin: 6px 0 12px; }
button, input { font: inherit; }
button { color: #245f9b; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid #3579bd; outline-offset: 3px; }
.muted { color: #687079; }
.path { color: #687079; font-size: 12px; overflow-wrap: anywhere; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 22px 0 12px; }
#search { width: 290px; max-width: 100%; border: 1px solid #d2d7dd; border-radius: 5px; padding: 8px 11px; }
.table-wrap { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: #687079; background: #fafafa; }
th, td { padding: 11px 12px; border-bottom: 1px solid #eceef0; vertical-align: top; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
td.name { width: 56%; }
.number { text-align: right; white-space: nowrap; }
.date { white-space: nowrap; }
.experiment-link, .back, .related-link { padding: 0; border: 0; background: none; text-align: left; }
.experiment-link { display: block; font-weight: 550; overflow-wrap: anywhere; }
.experiment-link:hover, .related-link:hover, .back:hover { text-decoration: underline; }
.experiment-row:hover { background: #fafbfc; }
.uncertain { display: inline-block; font-size: 11px; font-weight: 400; color: #8b651d; margin-left: 8px; }
.back { margin-bottom: 20px; }
.detail-header { margin-bottom: 24px; }
.empty { padding: 30px 0; color: #687079; }
details { margin: 14px 0; }
summary { cursor: pointer; }
.fold { border-top: 1px solid #e5e7eb; padding-top: 14px; }
.fold > summary { font-weight: 550; }
.relationship { border-bottom: 1px solid #eceef0; padding: 12px 0; }
.relation-description { color: #687079; font-size: 12px; }
.relationship details { margin: 6px 0 0; font-size: 12px; }
.evidence { margin: 8px 0; padding-left: 18px; overflow-wrap: anywhere; }
.kv td:first-child { width: 45%; color: #687079; }
.kv td { overflow-wrap: anywhere; }
.graph-scroll { overflow-x: auto; margin-top: 14px; }
.graph-scroll svg { width: 100%; min-width: 680px; display: block; }
.graph-node { cursor: pointer; }
.graph-node:focus rect { stroke: #245f9b; stroke-width: 2; }
.notice { color: #87631d; }
footer { border-top: 1px solid #e5e7eb; margin-top: 32px; padding-top: 12px; font-size: 12px; color: #687079; }
footer a { color: #245f9b; }
#scan-notes { max-height: 320px; overflow: auto; }
[hidden] { display: none !important; }
@media (max-width: 600px) {
  main { padding: 20px 16px; }
  .toolbar { flex-direction: column; align-items: stretch; gap: 8px; }
  #search { width: 100%; }
  th, td { padding: 9px 8px; }
  .overview .date { display: none; }
  td.name { min-width: 180px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>run-shelf</h1>
    <div id="scan-summary"></div>
    <div id="root" class="path"></div>
    <p id="partial" class="notice" hidden>Some files could not be scanned. See scan notes below.</p>
  </header>
  <section id="overview">
    <h2>Experiments</h2>
    <p class="muted">Choose an experiment to see its files and related experiments.</p>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search name or path" aria-label="Search experiments">
      <span id="list-count" class="muted"></span>
    </div>
    <div class="table-wrap">
      <table class="overview">
        <thead><tr><th>Name</th><th class="number">Checkpoints</th><th class="number">Size</th><th class="date">Modified</th></tr></thead>
        <tbody id="experiment-list"></tbody>
      </table>
    </div>
    <p id="empty" class="empty" hidden>No matching experiments.</p>
  </section>
  <section id="detail" hidden>
    <button class="back" id="back">← All experiments</button>
    <div id="experiment-detail"></div>
  </section>
  <footer>
    <a id="download" href="report.json" download="run-shelf-report.json">Download JSON</a>
    <details id="notes"><summary id="notes-label">Scan notes</summary><div id="scan-notes"></div></details>
  </footer>
</main>
<script>
"use strict";
const REPORT = __REPORT_DATA__;
const $ = id => document.getElementById(id);
const experiments = REPORT.experiments;
const byId = new Map(experiments.map(item => [item.id, item]));
const files = new Map(REPORT.artifacts.map(item => [item.id, item]));
const links = new Map(experiments.map(item => [item.id, []]));
for (const edge of REPORT.edges) {
  links.get(edge.source)?.push(edge);
  links.get(edge.target)?.push(edge);
}

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function size(bytes) {
  for (const unit of ['B', 'KB', 'MB', 'GB', 'TB']) {
    if (bytes < 1000 || unit === 'TB') return `${Number(bytes.toFixed(1))}${unit}`;
    bytes /= 1000;
  }
}

function modified(timestamp) {
  return timestamp == null ? 'Unknown' : new Date(timestamp * 1000).toLocaleString();
}

function describe(edge, selected) {
  const incoming = edge.target === selected;
  if (edge.kind === 'derived_from') return incoming ? 'Continues from' : 'Continued by';
  if (edge.kind === 'references') return incoming ? 'Uses a checkpoint from' : 'Checkpoint used by';
  if (edge.kind === 'same_artifact') return 'Has an identical checkpoint';
  if (edge.kind === 'possible_derivation') return incoming ? 'May continue from' : 'May be continued by';
  return 'Similar configuration or code';
}

function renderList() {
  const query = $('search').value.trim().toLowerCase();
  const matching = experiments.filter(item => `${item.name} ${item.path}`.toLowerCase().includes(query));
  $('experiment-list').replaceChildren();
  $('list-count').textContent = `${matching.length} of ${experiments.length}`;
  $('empty').hidden = matching.length > 0;
  for (const item of matching) {
    const row = element('tr', undefined, 'experiment-row');
    const name = element('td', undefined, 'name');
    const button = element('button', item.name, 'experiment-link');
    button.dataset.id = item.id;
    button.onclick = () => showExperiment(item.id);
    name.append(button);
    if (item.kind === 'checkpoint_candidate') button.append(element('span', 'Run unknown', 'uncertain'));
    name.append(element('div', item.path, 'path'));
    row.append(name, element('td', String(item.checkpoint_count), 'number'),
      element('td', size(item.checkpoint_bytes), 'number'), element('td', modified(item.modified), 'date'));
    $('experiment-list').append(row);
  }
}

function fold(parent, title, render) {
  const details = element('details', undefined, 'fold');
  details.append(element('summary', title));
  let rendered = false;
  details.addEventListener('toggle', () => {
    if (details.open && !rendered) { rendered = true; render(details); }
  });
  parent.append(details);
  return details;
}

function fileTable(parent, members) {
  if (!members.length) { parent.append(element('p', 'No checkpoint files found.', 'muted')); return; }
  const wrap = element('div', undefined, 'table-wrap');
  const table = element('table');
  const head = element('tr');
  for (const label of ['File', 'Size', 'Modified']) head.append(element('th', label));
  const thead = element('thead'); thead.append(head); table.append(thead);
  const body = element('tbody');
  for (const file of members) {
    const row = element('tr'), name = element('td');
    name.append(element('div', file.path.split('/').pop()), element('div', file.path, 'path'));
    row.append(name, element('td', size(file.size), 'number'), element('td', modified(file.modified), 'date'));
    body.append(row);
  }
  table.append(body); wrap.append(table); parent.append(wrap);
}

function valueTable(parent, values, sources) {
  const table = element('table', undefined, 'kv');
  for (const [key, value] of Object.entries(values)) {
    const row = element('tr'), name = element('td', key);
    const source = sources[key];
    if (source) name.append(element('div', Array.isArray(source) ? source.map(item => item.artifact).join(', ') : source, 'path'));
    row.append(name, element('td', typeof value === 'object' ? JSON.stringify(value) : String(value)));
    table.append(row);
  }
  parent.append(table);
}

function evidenceList(parent, edge) {
  const list = element('ul', undefined, 'evidence');
  list.append(element('li', `Confidence: ${Math.round(edge.confidence * 100)}% (evidence score, not a probability).`));
  for (const fact of edge.evidence) {
    const line = element('li', fact.signal);
    if (fact.artifact) line.append(element('div', `${fact.artifact}${fact.field ? ' · ' + fact.field : ''}`, 'path'));
    if (fact.value) line.append(element('div', String(fact.value), 'path'));
    if (fact.matched_fields?.length) line.append(element('div', `Matching fields: ${fact.matched_fields.join(', ')}`, 'path'));
    if (fact.artifacts?.length) line.append(element('div', fact.artifacts.join(', '), 'path'));
    list.append(line);
  }
  for (const caveat of edge.caveats) list.append(element('li', caveat));
  parent.append(list);
}

function showExperiment(id) {
  const item = byId.get(id);
  if (!item) return;
  $('overview').hidden = true;
  $('detail').hidden = false;
  const panel = $('experiment-detail'); panel.replaceChildren();
  const heading = element('div', undefined, 'detail-header');
  heading.append(element('h2', item.name), element('div', item.path, 'path'),
    element('p', `${item.checkpoint_count} checkpoints · ${size(item.checkpoint_bytes)} · Modified ${modified(item.modified)}`, 'muted'));
  if (item.kind === 'checkpoint_candidate') heading.append(element('p', 'This checkpoint could not be linked to a specific run.', 'notice'));
  panel.append(heading, element('h3', 'Checkpoints'));
  const members = item.artifacts.map(key => files.get(key)).filter(Boolean);
  fileTable(panel, members.filter(file => file.kind === 'checkpoint'));
  panel.append(element('h3', 'Related experiments'));
  const related = [...links.get(id)].sort((a, b) => b.confidence - a.confidence);
  if (!related.length) panel.append(element('p', 'No supported links found.', 'muted'));
  for (const edge of related) {
    const other = byId.get(edge.source === id ? edge.target : edge.source);
    const row = element('div', undefined, 'relationship');
    row.append(element('div', describe(edge, id), 'relation-description'));
    const button = element('button', other.path, 'related-link');
    button.onclick = () => showExperiment(other.id);
    row.append(button);
    const details = element('details'); details.append(element('summary', 'Why this link?'));
    let rendered = false;
    details.ontoggle = () => { if (details.open && !rendered) { rendered = true; evidenceList(details, edge); } };
    row.append(details); panel.append(row);
  }
  if (related.length) fold(panel, 'Show relationship graph', parent => renderGraph(parent, item, related));
  if (Object.keys(item.config).length) fold(panel, `Configuration (${Object.keys(item.config).length})`, parent => valueTable(parent, item.config, item.config_sources));
  if (Object.keys(item.metrics).length) fold(panel, `Metrics (${Object.keys(item.metrics).length})`, parent => valueTable(parent, item.metrics, item.metric_sources));
  const otherFiles = members.filter(file => file.kind !== 'checkpoint');
  if (otherFiles.length) fold(panel, `Other files (${otherFiles.length})`, parent => fileTable(parent, otherFiles));
  if (item.warnings.length) fold(panel, `Notes (${item.warnings.length})`, parent => {
    const list = element('ul', undefined, 'evidence');
    for (const warning of item.warnings) list.append(element('li', warning));
    parent.append(list);
  });
  window.scrollTo(0, 0);
  $('back').focus({preventScroll: true});
}

function renderGraph(parent, selected, related) {
  const ns = 'http://www.w3.org/2000/svg';
  const svgNode = (tag, attrs) => {
    const node = document.createElementNS(ns, tag);
    for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, value);
    return node;
  };
  const ids = [...new Set(related.map(edge => edge.source === selected.id ? edge.target : edge.source))];
  const height = Math.max(180, ids.length * 95 + 30), center = height / 2;
  const svg = svgNode('svg', {viewBox: `0 0 760 ${height}`, role: 'img', 'aria-label': 'Related experiments graph'});
  const defs = svgNode('defs'), marker = svgNode('marker', {id: 'arrow', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse'});
  marker.append(svgNode('path', {d: 'M0,0 L10,5 L0,10 z', fill: '#758493'})); defs.append(marker); svg.append(defs);
  const labels = {derived_from: 'continues', references: 'checkpoint use', same_artifact: 'identical file', possible_derivation: 'possible continuation', similar_to: 'similar'};
  related.forEach(edge => {
    const otherId = edge.source === selected.id ? edge.target : edge.source;
    const y = ids.indexOf(otherId) * 95 + 55;
    const line = svgNode('path', {d: `M250,${center} C345,${center} 345,${y} 440,${y}`, fill: 'none', stroke: '#a0acb8', 'stroke-width': 1.5});
    if (!edge.directed) line.setAttribute('stroke-dasharray', '4 4');
    else line.setAttribute(edge.source === selected.id ? 'marker-end' : 'marker-start', 'url(#arrow)');
    const title = svgNode('title'); title.textContent = `${labels[edge.kind]} · ${Math.round(edge.confidence * 100)}% confidence`;
    line.append(title); svg.append(line);
  });
  function card(item, x, y, current) {
    const group = svgNode('g', {transform: `translate(${x} ${y - 30})`, class: 'graph-node', tabindex: 0, role: 'button', 'aria-label': item.path});
    group.append(svgNode('rect', {width: current ? 230 : 295, height: 60, rx: 5, fill: current ? '#f0f5fa' : 'white', stroke: '#c8d1da'}));
    const title = svgNode('title'); title.textContent = item.path; group.append(title);
    const name = svgNode('text', {x: 12, y: 24, fill: '#24292f', 'font-size': 12});
    name.textContent = item.name.length > 28 ? item.name.slice(0, 26) + '…' : item.name;
    const hint = svgNode('text', {x: 12, y: 44, fill: '#687079', 'font-size': 10});
    hint.textContent = current ? 'Selected experiment' : item.path.length > 44 ? '…' + item.path.slice(-42) : item.path;
    group.append(name, hint);
    group.onclick = () => showExperiment(item.id);
    group.onkeydown = event => { if (event.key === 'Enter') showExperiment(item.id); };
    svg.append(group);
  }
  card(selected, 20, center, true);
  ids.forEach((id, index) => card(byId.get(id), 440, index * 95 + 55, false));
  const wrap = element('div', undefined, 'graph-scroll'); wrap.append(svg); parent.append(wrap);
  parent.append(element('p', 'Arrows show recorded use or possible continuation. Dotted lines show similarity or identical files.', 'path'));
}

$('scan-summary').textContent = `${REPORT.statistics.checkpoints} checkpoints · ${size(REPORT.statistics.checkpoint_bytes)}`;
$('root').textContent = REPORT.root;
$('partial').hidden = !REPORT.statistics.partial;
$('search').oninput = renderList;
$('download').onclick = event => {
  event.preventDefault();
  const url = URL.createObjectURL(new Blob([JSON.stringify(REPORT, null, 2)], {type: 'application/json'}));
  const link = element('a'); link.href = url; link.download = 'run-shelf-report.json'; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
$('back').onclick = () => {
  $('detail').hidden = true; $('overview').hidden = false;
  $('experiment-detail').replaceChildren();
  $('search').focus({preventScroll: true}); window.scrollTo(0, 0);
};
const noteCount = REPORT.warnings.length;
$('notes-label').textContent = noteCount ? `Scan notes (${noteCount})` : 'Scan notes';
let notesRendered = false;
$('notes').ontoggle = () => {
  if (!$('notes').open || notesRendered) return;
  notesRendered = true;
  const notes = $('scan-notes');
  notes.append(element('p', `Generated ${REPORT.generated_at}. ${REPORT.statistics.checkpoint_candidates} checkpoints have an unknown run. Sources were not modified.`));
  if (!noteCount) notes.append(element('p', 'No file-reading warnings.'));
  for (const warning of REPORT.warnings) {
    const p = element('p', warning.message); p.append(element('div', warning.path, 'path')); notes.append(p);
  }
};
renderList();
</script>
</body>
</html>
