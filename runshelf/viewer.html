<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>run-shelf</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; color: #24292f; background: #fff; font: 14px/1.6 system-ui, sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 32px 28px; }
main:has(#graph-view:not([hidden])) { max-width: 1480px; }
header { border-bottom: 1px solid #e5e7eb; padding-bottom: 18px; margin-bottom: 28px; }
h1 { font-size: 22px; margin: 0 0 6px; }
h2 { font-size: 19px; margin: 0 0 6px; overflow-wrap: anywhere; }
h3 { font-size: 15px; margin: 28px 0 8px; }
p { margin: 6px 0 12px; }
button, input { font: inherit; }
button { color: #245f9b; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid #3579bd; outline-offset: 3px; }
.muted { color: #687079; }
.path { color: #687079; font-size: 12px; overflow-wrap: anywhere; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 22px 0 12px; }
#search { width: 290px; max-width: 100%; border: 1px solid #d2d7dd; border-radius: 5px; padding: 8px 11px; }
.table-wrap { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: #687079; background: #fafafa; }
th, td { padding: 11px 12px; border-bottom: 1px solid #eceef0; vertical-align: top; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
td.name { width: 56%; }
.number { text-align: right; white-space: nowrap; }
.date { white-space: nowrap; }
.experiment-link, .back, .related-link { padding: 0; border: 0; background: none; text-align: left; }
.experiment-link { display: block; font-weight: 550; overflow-wrap: anywhere; }
.related-link { max-width: 100%; overflow-wrap: anywhere; }
.experiment-link:hover, .related-link:hover, .back:hover { text-decoration: underline; }
.experiment-row:hover { background: #fafbfc; }
.uncertain { display: inline-block; font-size: 11px; font-weight: 400; color: #8b651d; margin-left: 8px; }
.back { margin-bottom: 20px; }
.detail-header { margin-bottom: 24px; }
.empty { padding: 30px 0; color: #687079; }
details { margin: 14px 0; }
summary { cursor: pointer; }
.fold { border-top: 1px solid #e5e7eb; padding-top: 14px; }
.fold > summary { font-weight: 550; }
.relationship { border-bottom: 1px solid #eceef0; padding: 12px 0; }
.relation-description { color: #687079; font-size: 12px; overflow-wrap: anywhere; }
.relationship details { margin: 6px 0 0; font-size: 12px; }
.evidence { margin: 8px 0; padding-left: 18px; overflow-wrap: anywhere; }
.kv { table-layout: fixed; }
.kv th:first-child, .kv td:first-child { width: 28%; }
.kv th:nth-child(2), .kv td:nth-child(2) { width: 27%; }
.kv td { overflow-wrap: anywhere; }
.view-switch, .graph-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.view-switch button, .graph-tools button { border: 1px solid #d2d7dd; border-radius: 4px; padding: 5px 12px; background: white; }
.view-switch button[aria-pressed="true"] { background: #edf4fb; border-color: #3579bd; }
.graph-viewport { overflow: auto; max-height: 620px; border: 1px solid #e5e7eb; background: #fafbfc; }
.graph-viewport svg { display: block; }
.graph-node { cursor: pointer; }
.graph-edge { opacity: var(--source-opacity, .65); stroke-dasharray: 4 5; stroke-linecap: round; stroke-linejoin: round; transition: opacity .12s; }
.graph-edge.secondary { opacity: 0; pointer-events: none; }
.show-similar .graph-edge.secondary { opacity: var(--similarity-opacity, .12); pointer-events: stroke; }
.graph-edge.highlighted, .graph-edge.secondary.highlighted, .graph-edge:hover { opacity: 1; stroke-dasharray: none; stroke-width: 2.5; pointer-events: stroke; }
.graph-edge.secondary.highlighted { stroke-dasharray: 4 5; stroke-width: 1.6; }
.graph-edge.dimmed { opacity: .04; pointer-events: none; }
.graph-edge.secondary.dimmed { opacity: 0; pointer-events: none; }
.graph-node.dimmed text { opacity: .4; }
.graph-node.dimmed rect { stroke: #e5e7eb; }
.graph-node:hover rect, .graph-node:focus rect { fill: #edf4fb; stroke: #245f9b; stroke-width: 2; }
.graph-match rect { fill: #fff4cb; stroke: #ad7c08; }
.origin { margin: 18px 0; }
.notice { color: #87631d; }
.field-conflict { background: #fff9ec; }
.file-note { margin-top: 6px; font-size: 12px; overflow-wrap: anywhere; }
footer { border-top: 1px solid #e5e7eb; margin-top: 32px; padding-top: 12px; font-size: 12px; color: #687079; }
footer a { color: #245f9b; }
#scan-notes { max-height: 320px; overflow: auto; }
[hidden] { display: none !important; }
@media (max-width: 600px) {
  main { padding: 20px 16px; }
  .toolbar { flex-direction: column; align-items: stretch; gap: 8px; }
  #search { width: 100%; }
  th, td { padding: 9px 8px; }
  .overview .date { display: none; }
  td.name { min-width: 180px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>run-shelf</h1>
    <div id="scan-summary"></div>
    <div id="root" class="path"></div>
    <p id="partial" class="notice" hidden>Some files could not be scanned. See scan notes below.</p>
  </header>
  <section id="overview">
    <h2>Experiments</h2>
    <p class="muted">Choose an experiment to trace its sources and see its files.</p>
    <nav class="view-switch" aria-label="Experiment view">
      <button id="list-button" aria-pressed="true">List</button>
      <button id="graph-button" aria-pressed="false">Full graph</button>
    </nav>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search name or path" aria-label="Search experiments">
      <span id="list-count" class="muted"></span>
    </div>
    <div id="list-view" class="table-wrap">
      <table class="overview">
        <thead><tr><th>Name</th><th class="number">Checkpoints</th><th class="number">Size</th><th class="date">Modified</th></tr></thead>
        <tbody id="experiment-list"></tbody>
      </table>
    </div>
    <p id="empty" class="empty" hidden>No matching experiments.</p>
    <div id="graph-view" hidden>
      <label><input id="include-similar" type="checkbox" checked> Show all similarity / identical-file links</label>
      <p id="graph-count" class="muted"></p>
      <div id="global-graph"></div>
    </div>
  </section>
  <section id="detail" hidden>
    <button class="back" id="back">← All experiments</button>
    <div id="experiment-detail"></div>
  </section>
  <footer>
    <a id="download" href="report.json" download="run-shelf-report.json">Download JSON</a>
    <details id="notes"><summary id="notes-label">Scan notes</summary><div id="scan-notes"></div></details>
  </footer>
</main>
<script>
"use strict";
const REPORT = __REPORT_DATA__;
const $ = id => document.getElementById(id);
const experiments = REPORT.experiments;
const byId = new Map(experiments.map(item => [item.id, item]));
const files = new Map(REPORT.artifacts.map(item => [item.id, item]));
const links = new Map(experiments.map(item => [item.id, []]));
let overviewView = 'list';
for (const edge of REPORT.edges) {
  links.get(edge.source)?.push(edge);
  links.get(edge.target)?.push(edge);
}

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function size(bytes) {
  for (const unit of ['B', 'KB', 'MB', 'GB', 'TB']) {
    if (bytes < 1000 || unit === 'TB') return `${Number(bytes.toFixed(1))}${unit}`;
    bytes /= 1000;
  }
}

function modified(timestamp) {
  return timestamp == null ? 'Unknown' : new Date(timestamp * 1000).toLocaleString();
}

function describe(edge, selected) {
  if (edge.description === 'Conflicting source records') return edge.description;
  const incoming = edge.target === selected;
  if (edge.kind === 'derived_from') return incoming ? 'Continues from' : 'Continued by';
  if (edge.kind === 'references') return incoming ? 'Uses a checkpoint from' : 'Checkpoint used by';
  if (edge.kind === 'same_artifact') return 'Has an identical checkpoint';
  if (edge.kind === 'possible_derivation') return incoming ? 'May continue from' : 'May be continued by';
  return edge.description || 'Similar configuration or code';
}

function renderList() {
  const query = $('search').value.trim().toLowerCase();
  const matching = experiments.filter(item => `${item.name} ${item.path}`.toLowerCase().includes(query));
  $('experiment-list').replaceChildren();
  $('list-count').textContent = `${matching.length} of ${experiments.length}`;
  $('empty').hidden = matching.length > 0 || overviewView === 'graph';
  for (const item of matching) {
    const row = element('tr', undefined, 'experiment-row');
    const name = element('td', undefined, 'name');
    const button = element('button', item.name, 'experiment-link');
    button.dataset.id = item.id;
    button.onclick = () => showExperiment(item.id);
    name.append(button);
    if (item.kind === 'checkpoint_candidate') button.append(element('span', 'Run unknown', 'uncertain'));
    if (item.kind === 'collection') name.append(element('div', `Collection · ${item.children.length} sub-experiments`, 'path'));
    name.append(element('div', item.path, 'path'));
    row.append(name, element('td', item.kind === 'collection' ? `${item.subtree_checkpoint_count} total` : String(item.checkpoint_count), 'number'),
      element('td', size(item.kind === 'collection' ? item.subtree_checkpoint_bytes : item.checkpoint_bytes), 'number'), element('td', modified(item.modified), 'date'));
    $('experiment-list').append(row);
  }
  const matches = new Set(matching.map(item => item.id));
  for (const node of $('global-graph').querySelectorAll('.graph-node')) {
    node.classList.toggle('graph-match', Boolean(query) && matches.has(node.dataset.id));
  }
  if (overviewView === 'graph' && query && matching.length === 1) {
    const node = $('global-graph').querySelector(`[data-id="${matching[0].id}"]`);
    if (node) node.scrollIntoView({block: 'nearest', inline: 'center'});
  }
}

function fold(parent, title, render) {
  const details = element('details', undefined, 'fold');
  details.append(element('summary', title));
  let rendered = false;
  details.addEventListener('toggle', () => {
    if (details.open && !rendered) { rendered = true; render(details); }
  });
  parent.append(details);
  return details;
}

function fileTable(parent, members) {
  if (!members.length) { parent.append(element('p', 'No checkpoint files found.', 'muted')); return; }
  const wrap = element('div', undefined, 'table-wrap');
  const table = element('table');
  const head = element('tr');
  for (const label of ['File', 'Size', 'Modified']) head.append(element('th', label));
  const thead = element('thead'); thead.append(head); table.append(thead);
  const body = element('tbody');
  for (const file of members) {
    const row = element('tr'), name = element('td');
    name.append(element('div', file.path.split('/').pop()), element('div', file.path, 'path'));
    for (const warning of file.warnings || []) name.append(element('div', warning, 'notice file-note'));
    const records = file.metadata?.metric_records || [];
    if (records.length) {
      const details = fold(name, 'Checkpoint metrics', parent => {
        for (const record of records) {
          parent.append(element('p', `${record.basis} · Confidence: ${Math.round(record.confidence * 100)}%`, 'muted'));
          valueTable(parent, record.values, Object.fromEntries(Object.keys(record.values).map(key => [key, record.source])));
        }
      });
      details.dataset.checkpoint = file.id;
    }
    row.append(name, element('td', size(file.size), 'number'), element('td', modified(file.modified), 'date'));
    body.append(row);
  }
  table.append(body); wrap.append(table); parent.append(wrap);
}

function valueTable(parent, values, sources) {
  const wrap = element('div', undefined, 'table-wrap');
  const table = element('table', undefined, 'kv');
  const head = element('tr');
  for (const title of ['Name', 'Value', 'Path']) head.append(element('th', title));
  const thead = element('thead'); thead.append(head); table.append(thead);
  const body = element('tbody');
  for (const [key, value] of Object.entries(values)) {
    const source = sources[key];
    const prefix = typeof source === 'string' ? source.split('/').pop() + ':' : '';
    const name = prefix && key.startsWith(prefix) ? key.slice(prefix.length) : key;
    const variants = new Map();
    for (const entry of Array.isArray(source) && source.length ? source : [{value, artifact: source || '—'}]) {
      const signature = JSON.stringify(entry.value);
      if (!variants.has(signature)) variants.set(signature, {value: entry.value, paths: new Set(), inherited: false});
      const variant = variants.get(signature); variant.paths.add(entry.artifact); variant.inherited ||= Boolean(entry.inherited);
    }
    for (const variant of variants.values()) {
      const row = element('tr', undefined, variants.size > 1 ? 'field-conflict' : undefined), path = element('td', undefined, 'path');
      row.dataset.field = key;
      for (const file of variant.paths) path.append(element('div', file));
      if (variant.inherited) path.append(element('div', 'Shared parent config (inferred)', 'muted'));
      const label = element('td', name);
      if (variants.size > 1) label.append(element('div', 'Conflicting values', 'notice'));
      row.append(label, element('td', typeof variant.value === 'object' ? JSON.stringify(variant.value) : String(variant.value)), path);
      body.append(row);
    }
  }
  table.append(body); wrap.append(table); parent.append(wrap);
}

function evidenceList(parent, edge) {
  const list = element('ul', undefined, 'evidence');
  list.append(element('li', `Confidence: ${Math.round(edge.confidence * 100)}% (evidence score, not a probability).`));
  for (const fact of edge.evidence) {
    const line = element('li', fact.signal);
    if (fact.artifact) line.append(element('div', `${fact.artifact}${fact.field ? ' · ' + fact.field : ''}`, 'path'));
    if (fact.value) line.append(element('div', String(fact.value), 'path'));
    if (fact.matched_fields?.length) line.append(element('div', `Matching fields: ${fact.matched_fields.join(', ')}`, 'path'));
    if (fact.artifacts?.length) line.append(element('div', fact.artifacts.join(', '), 'path'));
    if (fact.matched_artifacts?.length) line.append(element('div', `Matched file: ${fact.matched_artifacts.join(', ')}`, 'path'));
    list.append(line);
  }
  for (const caveat of edge.caveats) list.append(element('li', caveat));
  parent.append(list);
  if (Object.keys(edge.changes || {}).length) {
    parent.append(element('p', `Recorded differences: ${byId.get(edge.source).path} vs ${byId.get(edge.target).path}`, 'path'));
    const table = element('table', undefined, 'kv'), head = element('tr');
    for (const label of ['Name', 'First', 'Second']) head.append(element('th', label));
    const thead = element('thead'); thead.append(head); table.append(thead);
    const body = element('tbody');
    for (const [key, change] of Object.entries(edge.changes)) {
      const row = element('tr');
      for (const value of [key, change.source ?? '(not recorded)', change.target ?? '(not recorded)']) row.append(element('td', String(value)));
      body.append(row);
    }
    table.append(body); const wrap = element('div', undefined, 'table-wrap'); wrap.append(table); parent.append(wrap);
  }
}

function relationshipList(parent, edges, id) {
  for (const edge of edges) {
    const other = byId.get(edge.source === id ? edge.target : edge.source);
    const row = element('div', undefined, 'relationship');
    row.dataset.edgeId = edge.id;
    row.append(element('div', `${describe(edge, id)} · ${Math.round(edge.confidence * 100)}% confidence`, 'relation-description'));
    const button = element('button', other.path, 'related-link');
    button.onclick = () => showExperiment(other.id);
    row.append(button);
    const fact = edge.evidence.find(item => item.artifact);
    if (fact) row.append(element('div', `${fact.artifact}${fact.component ? ' · component: ' + fact.component : fact.field ? ' · ' + fact.field : ''}`, 'path'));
    const details = element('details'); details.append(element('summary', 'Why this link?'));
    let rendered = false;
    details.ontoggle = () => { if (details.open && !rendered) { rendered = true; evidenceList(details, edge); } };
    row.append(details); parent.append(row);
  }
}

function lineageFor(id) {
  // Follow ancestors and descendants separately, without pulling in unrelated siblings.
  const result = new Map();
  for (const direction of ['source', 'target']) {
    const pending = [id], seen = new Set();
    while (pending.length) {
      const current = pending.pop();
      if (seen.has(current)) continue;
      seen.add(current);
      for (const edge of links.get(current)) {
        if (!edge.directed || edge[direction] !== current) continue;
        result.set(edge.id, edge);
        pending.push(edge[direction === 'source' ? 'target' : 'source']);
      }
    }
  }
  return [...result.values()];
}

function showExperiment(id) {
  const item = byId.get(id);
  if (!item) return;
  $('overview').hidden = true;
  $('detail').hidden = false;
  const panel = $('experiment-detail'); panel.replaceChildren();
  const heading = element('div', undefined, 'detail-header');
  const collection = item.kind === 'collection';
  heading.append(element('h2', item.name), element('div', item.path, 'path'),
    element('p', collection ? `Collection · ${item.children.length} sub-experiments · ${item.subtree_checkpoint_count} checkpoints total · ${size(item.subtree_checkpoint_bytes)}` : `${item.checkpoint_count} checkpoints · ${size(item.checkpoint_bytes)} · Modified ${modified(item.modified)}`, 'muted'));
  if (item.parent_id) {
    const parent = byId.get(item.parent_id), button = element('button', `Collection: ${parent.name}`, 'related-link');
    button.dataset.collection = parent.id; button.onclick = () => showExperiment(parent.id); heading.append(button);
  }
  if (Object.keys(item.roles || {}).length && !collection) heading.append(element('p', Object.entries(item.roles).map(([key, value]) => `${key}: ${value}`).join(' · '), 'muted'));
  if (item.kind === 'checkpoint_candidate') heading.append(element('p', 'This checkpoint could not be linked to a specific run.', 'notice'));
  if (item.warnings.some(note => /conflict|disagree/i.test(note))) heading.append(element('p', 'Some records disagree. Conflicting values and sources are highlighted below.', 'notice'));
  panel.append(heading);
  if (collection) {
    const children = element('section'); children.id = 'collection-members';
    children.append(element('h3', 'Sub-experiments'), element('p', 'Directory membership; this does not imply model inheritance.', 'muted'));
    for (const childId of item.children) {
      const child = byId.get(childId), row = element('div', undefined, 'relationship');
      const button = element('button', item.path === '.' ? child.path : child.path.slice(item.path.length + 1), 'related-link');
      button.title = child.path;
      button.dataset.child = childId; button.onclick = () => showExperiment(childId);
      row.append(button, element('div', `${child.kind === 'collection' ? child.subtree_checkpoint_count : child.checkpoint_count} checkpoints`, 'path')); children.append(row);
    }
    panel.append(children);
  }
  const related = [...links.get(id)].sort((a, b) => b.confidence - a.confidence);
  const sources = related.filter(edge => edge.directed && edge.target === id);
  const downstream = related.filter(edge => edge.directed && edge.source === id);
  const origin = element('section', undefined, 'origin'); origin.id = 'origin';
  origin.append(element('h3', 'Sources'));
  if (item.references.some(ref => ref.conflict)) origin.append(element('p', 'Source records disagree; origin is uncertain. Both accounts are shown below.', 'notice'));
  if (collection || !sources.some(edge => edge.kind === 'derived_from')) {
    origin.append(element('p', collection ? "Shared sources; check each sub-experiment's own evidence." : sources.length ? 'No recorded continuation found. Checkpoint use and possible sources are listed below.' : 'Origin unknown: no source link found. Similarity alone cannot establish where this experiment came from.', 'muted'));
  }
  relationshipList(origin, sources, id);
  for (const reference of item.references.filter(ref => ['unresolved', 'ambiguous'].includes(ref.resolution))) {
    const row = element('div', undefined, 'relationship');
    row.append(element('div', reference.resolution === 'ambiguous' ? 'Source ambiguous — multiple matches' : 'Source not found in this scan', 'notice'),
      element('div', reference.value, 'path'), element('div', `${reference.artifact} · ${reference.field}`, 'path'));
    for (const candidate of reference.candidates || []) {
      const button = element('button', byId.get(candidate).path, 'related-link');
      button.onclick = () => showExperiment(candidate);
      const candidateRow = element('div'); candidateRow.append(button); row.append(candidateRow);
    }
    origin.append(row);
  }
  panel.append(origin);
  const lineage = [...lineageFor(id), ...related.filter(edge => !edge.directed)];
  if (lineage.length) {
    panel.append(element('h3', 'Relationships'));
    const graph = element('div'); graph.id = 'lineage-graph'; panel.append(graph);
    const ids = new Set([id, ...lineage.flatMap(edge => [edge.source, edge.target])]);
    renderGraph(graph, experiments.filter(exp => ids.has(exp.id)), lineage, id);
  }
  panel.append(element('h3', 'Used by'));
  if (!downstream.length) panel.append(element('p', 'No downstream experiment found.', 'muted'));
  relationshipList(panel, downstream, id);
  const similar = related.filter(edge => !edge.directed);
  if (similar.length) fold(panel, `Similar experiments and identical files (${similar.length})`, parent => {
    parent.append(element('p', 'These links do not establish origin or copy direction.', 'muted'));
    relationshipList(parent, similar, id);
  });
  const members = item.artifacts.map(key => files.get(key)).filter(Boolean);
  if (!collection) {
    panel.append(element('h3', 'Checkpoints'));
    fileTable(panel, members.filter(file => file.kind === 'checkpoint'));
  }
  if (Object.keys(item.config).length) fold(panel, `Configuration (${Object.keys(item.config).length})`, parent => valueTable(parent, item.config, item.config_sources));
  if (Object.keys(item.metrics).length) fold(panel, `Metrics (${Object.keys(item.metrics).length})`, parent => {
    parent.append(element('p', 'Run summaries / last parsed log values; not necessarily a particular checkpoint.', 'muted'));
    valueTable(parent, item.metrics, item.metric_sources);
  });
  const otherFiles = members.filter(file => file.kind !== 'checkpoint');
  if (otherFiles.length) fold(panel, `Other files (${otherFiles.length})`, parent => fileTable(parent, otherFiles));
  if (item.warnings.length) fold(panel, `Notes (${item.warnings.length})`, parent => {
    const list = element('ul', undefined, 'evidence');
    for (const warning of item.warnings) list.append(element('li', warning));
    parent.append(list);
  });
  window.scrollTo(0, 0);
  $('back').focus({preventScroll: true});
}

function layoutGraph(nodes, edges, availableWidth, selectedId) {
  const adjacency = new Map(nodes.map(item => [item.id, []]));
  for (const edge of edges) {
    const weight = edge.directed ? 3 : edge.kind === 'same_artifact' ? 2 : edge.confidence;
    adjacency.get(edge.source).push({id: edge.target, weight});
    adjacency.get(edge.target).push({id: edge.source, weight});
  }
  const components = [], seen = new Set();
  for (const node of nodes) {
    if (seen.has(node.id)) continue;
    const ids = [], pending = [node.id]; seen.add(node.id);
    while (pending.length) {
      const id = pending.pop(); ids.push(id);
      for (const next of adjacency.get(id)) if (!seen.has(next.id)) { seen.add(next.id); pending.push(next.id); }
    }
    components.push(ids);
  }
  components.sort((a, b) => Number(b.includes(selectedId)) - Number(a.includes(selectedId)) || b.length - a.length);
  const boxes = components.map(ids => {
    ids.sort((a, b) => byId.get(a).path.localeCompare(byId.get(b).path));
    const members = new Set(ids), parents = new Map(ids.map(id => [id, []])), children = new Map(ids.map(id => [id, []]));
    for (const edge of edges.filter(edge => edge.directed && members.has(edge.source))) {
      parents.get(edge.target).push(edge.source); children.get(edge.source).push(edge.target);
    }
    const incoming = new Map(ids.map(id => [id, parents.get(id).length])), depth = new Map(ids.map(id => [id, 0]));
    const order = ids.filter(id => !incoming.get(id));
    for (let i = 0; i < order.length; i++) for (const child of children.get(order[i])) {
      depth.set(child, Math.max(depth.get(child), depth.get(order[i]) + 1));
      incoming.set(child, incoming.get(child) - 1);
      if (!incoming.get(child)) order.push(child);
    }
    const acyclic = order.length === ids.length, remaining = new Map(ids.map(id => [id, 0]));
    if (acyclic) for (const id of [...order].reverse()) for (const child of children.get(id)) remaining.set(id, Math.max(remaining.get(id), remaining.get(child) + 1));
    else { order.splice(0, order.length, ...ids); for (const id of ids) depth.set(id, 0); }
    // Reserve room for source chains, then fill their gaps with the other experiments.
    const constrained = id => parents.get(id).length || children.get(id).length;
    const placement = [...order.filter(constrained), ...order.filter(id => !constrained(id))];
    const count = Math.max(...depth.values()) + 1;
    const columns = Array.from({length: Math.max(count, Math.min(Math.ceil(Math.sqrt(ids.length)), Math.max(1, Math.floor((availableWidth - 40) / 264))))}, () => []);
    const ranks = new Map();
    // All relationships influence proximity. Only recorded direction constrains columns.
    for (const id of placement) {
      const lower = acyclic ? Math.max(0, ...parents.get(id).map(parent => ranks.get(parent) + 1)) : 0;
      const upper = columns.length - 1 - remaining.get(id);
      const neighbors = adjacency.get(id).filter(next => ranks.has(next.id));
      const weight = neighbors.reduce((sum, next) => sum + next.weight, 0);
      let best = lower, score = Infinity;
      for (let column = lower; column <= upper; column++) {
        const distance = neighbors.reduce((sum, next) => sum + next.weight * Math.abs(column - ranks.get(next.id)), 0) / (weight || 1);
        const candidate = columns[column].length * 1.5 + distance;
        if (candidate < score) { score = candidate; best = column; }
      }
      ranks.set(id, best); columns[best].push(id);
    }
    for (let sweep = 0; sweep < 8; sweep++) {
      const positions = new Map();
      columns.forEach(column => column.forEach((id, i) => positions.set(id, i - (column.length - 1) / 2)));
      for (const column of sweep % 2 ? [...columns].reverse() : columns) {
        const score = id => {
          const neighbors = adjacency.get(id).filter(next => ranks.get(next.id) !== ranks.get(id));
          const weight = neighbors.reduce((sum, next) => sum + next.weight, 0);
          return weight ? neighbors.reduce((sum, next) => sum + next.weight * positions.get(next.id), 0) / weight : positions.get(id);
        };
        column.sort((a, b) => score(a) - score(b));
        column.forEach((id, i) => positions.set(id, i - (column.length - 1) / 2));
      }
    }
    const rows = Math.max(...columns.map(column => column.length)), points = new Map();
    columns.forEach((column, rank) => column.forEach((id, i) => points.set(id, {x: rank * 300, y: i * 132})));
    return {points, width: (columns.length - 1) * 300 + 220, height: (rows - 1) * 132 + 64};
  });
  const width = Math.max(1000, availableWidth - 2, ...boxes.map(box => box.width + 48)), points = new Map();
  let x = 24, y = 24, rowHeight = 0;
  for (const box of boxes) {
    if (x + box.width > width - 24) { x = 24; y += rowHeight + 64; rowHeight = 0; }
    for (const [id, point] of box.points) points.set(id, {x: x + point.x, y: y + point.y});
    x += box.width + 64; rowHeight = Math.max(rowHeight, box.height);
  }
  return {points, width, height: y + rowHeight + 24};
}

function graphRouter(points, width, height) {
  // The grid is only a guide when a direct curve would cross a card.
  const boxes = [...points.values()].map(p => ({x: p.x, y: p.y, width: 220, height: 64}));
  const obstacles = boxes.map(b => ({left: b.x - 8, right: b.x + b.width + 8, top: b.y - 8, bottom: b.y + b.height + 8}));
  function coordinates(axis, extent, limit) {
    const values = [...new Set([4, limit - 4, ...boxes.flatMap(b => [b[axis] - 20, b[axis] + b[extent] + 20])])].sort((a, b) => a - b);
    return [...values, ...values.slice(1).flatMap((v, i) => v - values[i] >= 24 ? [(v + values[i]) / 2] : [])].sort((a, b) => a - b);
  }
  const xs = coordinates('x', 'width', width), ys = coordinates('y', 'height', height), columns = xs.length;
  const point = index => ({x: xs[index % columns], y: ys[Math.floor(index / columns)]});
  const clear = (a, b) => !obstacles.some(o => a.x === b.x
    ? a.x > o.left && a.x < o.right && Math.max(a.y, b.y) > o.top && Math.min(a.y, b.y) < o.bottom
    : a.y > o.top && a.y < o.bottom && Math.max(a.x, b.x) > o.left && Math.min(a.x, b.x) < o.right);
  const neighbors = new Map(), traffic = new Map();
  const segmentKey = (a, b) => `${Math.min(a, b)}:${Math.max(a, b)}`;
  function adjacent(index) {
    if (!neighbors.has(index)) {
      const x = index % columns, y = Math.floor(index / columns), a = point(index);
      const candidates = [x > 0 ? index - 1 : -1, x + 1 < columns ? index + 1 : -1, y > 0 ? index - columns : -1, y + 1 < ys.length ? index + columns : -1];
      neighbors.set(index, candidates.filter(next => next >= 0 && clear(a, point(next))));
    }
    return neighbors.get(index);
  }
  function attachments(p) {
    const x = xs.indexOf(p.x), below = ys.findIndex(y => y >= p.y);
    return [...new Set([below - 1, below])].filter(y => y >= 0 && y < ys.length)
      .map(y => y * columns + x).filter(index => clear(p, point(index)));
  }
  return (a, b, recorded, lane) => {
    const distance = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
    const middle = (p, q) => ({x: (p.x + q.x) / 2, y: (p.y + q.y) / 2});
    const barriers = boxes.map(box => {
      const endpoint = [a, b].some(p => p.y >= box.y && p.y <= box.y + box.height && (p.x === box.x || p.x === box.x + box.width));
      const margin = endpoint ? 0 : 3;
      return {left: box.x - margin, right: box.x + box.width + margin, top: box.y - margin, bottom: box.y + box.height + margin};
    });
    // Subdivide Beziers against card rectangles; their control-point hull bounds each piece.
    function curveClear(curve, candidates = barriers, depth = 0) {
      const left = Math.min(...curve.map(p => p.x)), right = Math.max(...curve.map(p => p.x));
      const top = Math.min(...curve.map(p => p.y)), bottom = Math.max(...curve.map(p => p.y));
      const hits = candidates.filter(o => right > o.left + .001 && left < o.right - .001 && bottom > o.top + .001 && top < o.bottom - .001);
      if (!hits.length) return true;
      if (depth === 10) return false;
      const [p, c, d, q] = curve, pc = middle(p, c), cd = middle(c, d), dq = middle(d, q);
      const first = middle(pc, cd), second = middle(cd, dq), center = middle(first, second);
      return curveClear([p, pc, first, center], hits, depth + 1) && curveClear([center, second, dq, q], hits, depth + 1);
    }
    const encode = curves => `M${a.x},${a.y}` + curves.map(([, c, d, q]) => ` C${c.x},${c.y} ${d.x},${d.y} ${q.x},${q.y}`).join('');
    function gentle([p, c, d, q]) {
      // A long, narrow S-curve can be collision-free but still hook sharply at its ends.
      for (let step = 0; step <= 20; step++) {
        const t = step / 20, u = 1 - t;
        const dx = 3 * (u * u * (c.x - p.x) + 2 * u * t * (d.x - c.x) + t * t * (q.x - d.x));
        const dy = 3 * (u * u * (c.y - p.y) + 2 * u * t * (d.y - c.y) + t * t * (q.y - d.y));
        const ddx = 6 * (u * (d.x - 2 * c.x + p.x) + t * (q.x - 2 * d.x + c.x));
        const ddy = 6 * (u * (d.y - 2 * c.y + p.y) + t * (q.y - 2 * d.y + c.y));
        const speed = Math.hypot(dx, dy);
        if (speed > .001 && Math.abs(dx * ddy - dy * ddx) / speed ** 3 > 1 / 10) return false;
      }
      return true;
    }
    const bend = a.x === b.x ? 64 + lane : Math.max(24, Math.min(160, Math.abs(b.x - a.x) * .5) + lane);
    const direct = [a, {x: a.x + a.sign * bend, y: a.y}, {x: b.x + b.sign * bend, y: b.y}, b];
    if (curveClear(direct) && gentle(direct)) return encode([direct]);
    const start = {x: a.x + a.sign * 20, y: a.y}, end = {x: b.x + b.sign * 20, y: b.y};
    const goals = new Set(attachments(end)), costs = new Map(), previous = new Map(), heap = [];
    function push(state, cost) {
      const item = {state, cost, score: cost + distance(point(Math.floor(state / 2)), end)};
      let i = heap.length; heap.push(item);
      while (i > 0) { const p = (i - 1) >> 1; if (heap[p].score <= item.score) break; heap[i] = heap[p]; i = p; }

    }
    function pop() {
      const first = heap[0], last = heap.pop();

        }
        heap[i] = last;
      }
      return first;
    }
    for (const index of attachments(start)) {
      const cost = distance(start, point(index)), state = index * 2 + 1;
      costs.set(state, cost); push(state, cost);
    }
    let found;
    while (heap.length) {
      const {state, cost} = pop();
      if (cost !== costs.get(state)) continue;
      const index = Math.floor(state / 2), p = point(index);
      if (goals.has(index)) { found = state; break; }
      for (const next of adjacent(index)) {
        const q = point(next), direction = p.x === q.x ? 1 : 0, nextState = next * 2 + direction;
        const penalty = recorded ? (traffic.get(segmentKey(index, next)) || 0) * 6 : 0;
        const total = cost + distance(p, q) + (direction === state % 2 ? 0 : 18) + penalty;
        if (total >= (costs.get(nextState) ?? Infinity)) continue;

    // Never fall back to a straight line through a card if a malformed layout blocks a path.

    indices.reverse();
    if (recorded) for (let i = 1; i < indices.length; i++) {
      const key = segmentKey(indices[i - 1], indices[i]); traffic.set(key, (traffic.get(key) || 0) + 1);
    }
    // Round before and after each bend, instead of forcing a spline through the corner.
    const shifted = indices.map(index => {
      const p = point(index);
      return {x: Math.max(4, Math.min(width - 4, p.x + lane)), y: Math.max(4, Math.min(height - 4, p.y + lane))};
    });
    const guides = [a, {x: shifted[0].x, y: a.y}, ...shifted, {x: shifted.at(-1).x, y: b.y}, b];
    const route = [];
    for (const p of guides) {
      if (route.length && distance(route.at(-1), p) < .01) continue;
      while (route.length > 1) {
        const q = route.at(-1), r = route.at(-2);
        if (!((r.x === q.x && q.x === p.x) || (r.y === q.y && q.y === p.y))) break;
        route.pop();
      }
      route.push(p);
    }
    const curves = [];
    let cursor = a;
    function straight(q) {
      if (distance(cursor, q) > .01) curves.push([cursor, middle(cursor, q), middle(cursor, q), q]);
      cursor = q;
    }
    for (let i = 1; i < route.length - 1; i++) {
      const p = route[i], before = route[i - 1], after = route[i + 1];
      const incoming = distance(p, before), outgoing = distance(p, after);
      let radius = Math.min(72, incoming / (i === 1 ? 1 : 2), outgoing / (i === route.length - 2 ? 1 : 2)), turn;
      for (let attempt = 0; attempt < 12; attempt++) {
        const entry = {x: p.x + (before.x - p.x) * radius / incoming, y: p.y + (before.y - p.y) * radius / incoming};
        const exit = {x: p.x + (after.x - p.x) * radius / outgoing, y: p.y + (after.y - p.y) * radius / outgoing};
        // A cubic circular arc keeps the tangent aligned with both adjoining segments.
        const k = .5522847498;
        turn = [entry, {x: entry.x + (p.x - entry.x) * k, y: entry.y + (p.y - entry.y) * k},
          {x: exit.x + (p.x - exit.x) * k, y: exit.y + (p.y - exit.y) * k}, exit];
        if (curveClear(turn)) break;
        radius *= .75;
      }
      straight(turn[0]); curves.push(turn); cursor = turn[3];
    }
    straight(b);
    return curves.every(curve => curveClear(curve)) ? encode(curves) : '';

  };
}

function renderGraph(parent, nodes, edges, selectedId = null) {
  parent.replaceChildren();
  if (!nodes.length) { parent.append(element('p', 'No experiments found.', 'muted')); return; }
  const ns = 'http://www.w3.org/2000/svg';
  const svgNode = (tag, attrs) => {
    const node = document.createElementNS(ns, tag);
    for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, value);
    return node;
  };
  const {points, width, height} = layoutGraph(nodes, edges, parent.clientWidth, selectedId);
  const svg = svgNode('svg', {viewBox: `0 0 ${width} ${height}`, role: 'group', 'aria-label': selectedId ? 'Experiment relationships' : 'All experiments graph'});
  svg.classList.toggle('show-similar', Boolean(selectedId) || $('include-similar').checked);
  const dense = edges.filter(edge => edge.directed).length > 20;
  svg.style.setProperty('--source-opacity', dense ? '.3' : '.65');
  const density = Math.max(1, edges.length / Math.max(nodes.length * 4, 1));
  svg.style.setProperty('--similarity-opacity', String(.12 / density));
  const arrowId = selectedId ? 'lineage-arrow' : 'global-arrow';
  const defs = svgNode('defs'), marker = svgNode('marker', {id: arrowId, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto'});
  marker.append(svgNode('path', {d: 'M0,0 L10,5 L0,10 z', fill: '#758493'})); defs.append(marker); svg.append(defs);
  const routeEdge = graphRouter(points, width, height);
  const labels = {derived_from: 'Continues', references: 'Uses checkpoint', same_artifact: 'Identical checkpoint', possible_derivation: 'May continue', similar_to: 'Similar settings / code'};
  const ports = new Map(), endpoints = new Map();
  for (const edge of edges) {
    const a = points.get(edge.source), b = points.get(edge.target);
    const sides = b.x > a.x ? ['right', 'left'] : b.x < a.x ? ['left', 'right'] : ['right', 'right'];
    [edge.source, edge.target].forEach((id, index) => {
      const key = `${id}:${sides[index]}`;
      if (!ports.has(key)) ports.set(key, []);
      ports.get(key).push({edge, index, side: sides[index], point: points.get(id), other: index ? a : b});
    });
  }
  for (const entries of ports.values()) {
    entries.sort((a, b) => a.other.y - b.other.y || a.other.x - b.other.x || a.edge.id.localeCompare(b.edge.id));
    entries.forEach((entry, i) => endpoints.set(`${entry.edge.id}:${entry.index}`, {
      x: entry.point.x + (entry.side === 'right' ? 220 : 0), y: entry.point.y + 12 + 40 * (i + 1) / (entries.length + 1),
      sign: entry.side === 'right' ? 1 : -1
    }));
  }
  // Route recorded sources first; paint them above the secondary relationships.
  const routes = new Map();
  for (const [index, edge] of [...edges].sort((a, b) => Number(b.directed) - Number(a.directed)).entries()) {
    const lane = ((index * .61803398875) % 1 - .5) * 20;
    routes.set(edge.id, routeEdge(endpoints.get(`${edge.id}:0`), endpoints.get(`${edge.id}:1`), edge.directed, lane));
  }
  [...edges].sort((a, b) => Number(a.directed) - Number(b.directed)).forEach(edge => {
    const route = routes.get(edge.id);
    const tentative = edge.kind === 'possible_derivation' || edge.description === 'Conflicting source records';
    const line = svgNode('path', {d: route, fill: 'none', stroke: tentative ? '#af7a28' : edge.directed ? '#527c9d' : '#a0acb8', 'stroke-width': edge.directed ? 1.8 : 1, class: edge.directed ? 'graph-edge' : 'graph-edge secondary', 'data-id': edge.id, 'data-source': edge.source, 'data-target': edge.target});
    if (edge.directed) line.setAttribute('marker-end', `url(#${arrowId})`);
    const title = svgNode('title'); title.textContent = `${edge.description || labels[edge.kind]} · ${Math.round(edge.confidence * 100)}% confidence`;
    line.append(title); svg.append(line);
  });
  for (const item of nodes) {
    const {x, y} = points.get(item.id), current = item.id === selectedId;
    const group = svgNode('g', {transform: `translate(${x} ${y})`, class: 'graph-node', 'data-id': item.id, tabindex: 0, role: 'button', 'aria-label': item.path});
    group.append(svgNode('rect', {width: 220, height: 64, rx: 5, fill: current ? '#e8f2fc' : item.kind === 'collection' ? '#f3f5f7' : 'white', stroke: current ? '#3579bd' : '#c8d1da'}));
    const title = svgNode('title'); title.textContent = item.path; group.append(title);
    const name = svgNode('text', {x: 12, y: 24, fill: '#24292f', 'font-size': 14});
    name.textContent = item.name.length > 28 ? item.name.slice(0, 26) + '…' : item.name;
    const hint = svgNode('text', {x: 12, y: 40, fill: '#687079', 'font-size': 10});
    hint.textContent = item.path.length > 32 ? '…' + item.path.slice(-30) : item.path;
    const meta = svgNode('text', {x: 12, y: 55, fill: '#687079', 'font-size': 10});
    const similarCount = links.get(item.id).filter(edge => !edge.directed).length;
    meta.textContent = item.kind === 'collection' ? `Collection · ${item.children.length} runs` : `${item.checkpoint_count} checkpoint${item.checkpoint_count === 1 ? '' : 's'}${similarCount ? ` · ${similarCount} similar / identical` : ''}`;
    group.append(name, hint, meta);
    group.onclick = () => showExperiment(item.id);
    const highlight = active => {
      const neighbors = new Set([item.id]);
      for (const line of svg.querySelectorAll('.graph-edge')) {
        const connected = line.dataset.source === item.id || line.dataset.target === item.id;
        line.classList.toggle('dimmed', active && !connected);
        line.classList.toggle('highlighted', active && connected);
        if (connected) { neighbors.add(line.dataset.source); neighbors.add(line.dataset.target); }
      }
      for (const node of svg.querySelectorAll('.graph-node')) node.classList.toggle('dimmed', active && !neighbors.has(node.dataset.id));
    };
    group.onmouseenter = group.onfocus = () => highlight(true);
    group.onmouseleave = group.onblur = () => highlight(false);
    group.onkeydown = event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); showExperiment(item.id); } };
    svg.append(group);
  }
  const toolbar = element('div', undefined, 'graph-tools'), zoom = element('span', '100%', 'path');
  const wrap = element('div', undefined, 'graph-viewport'); wrap.tabIndex = 0; wrap.setAttribute('aria-label', 'Scrollable graph');
  let scale = 1;
  function resize(value) {
    scale = Math.max(.05, Math.min(2, value));
    svg.style.width = `${width * scale}px`; svg.style.height = `${height * scale}px`;
    zoom.textContent = `${Math.round(scale * 100)}%`;
  }
  for (const [label, action] of [['−', () => resize(scale / 1.25)], ['+', () => resize(scale * 1.25)], ['Fit', () => resize(Math.max(.75, Math.min(wrap.clientWidth / width, 1)))], ['100%', () => resize(1)]]) {
    const button = element('button', label); button.onclick = action; toolbar.append(button);
  }
  toolbar.append(zoom); parent.append(toolbar);
  wrap.append(svg); parent.append(wrap); resize(Math.max(.75, Math.min(wrap.clientWidth / width, 1)));
  for (const text of svg.querySelectorAll('.graph-node text')) {
    while (text.getComputedTextLength() > 196 && text.textContent.length > 2) text.textContent = text.textContent.replace(/…$/, '').slice(0, -1) + '…';
  }
  parent.append(element('p', 'Arrows show source → use; lines without arrows show similarity or identical files. Hover to highlight connections; click for evidence.', 'path'));
}

function showOverview(view) {
  overviewView = view;
  $('list-view').hidden = view !== 'list'; $('graph-view').hidden = view !== 'graph';
  $('list-button').setAttribute('aria-pressed', String(view === 'list'));
  $('graph-button').setAttribute('aria-pressed', String(view === 'graph'));
  if (view === 'graph' && !$('global-graph').children.length) renderOverviewGraph();
  renderList();
}

function renderOverviewGraph() {
  const edges = REPORT.edges;
  const sourceCount = edges.filter(edge => edge.directed).length;
  const collections = experiments.filter(item => item.kind === 'collection').length;
  $('graph-count').textContent = `${experiments.length - collections} experiments${collections ? ` · ${collections} collections` : ''} · ${sourceCount} source links · ${edges.length - sourceCount} similarity / identical-file links`;
  renderGraph($('global-graph'), experiments, edges);
  renderList();
}

$('scan-summary').textContent = `${REPORT.statistics.checkpoints} checkpoints · ${size(REPORT.statistics.checkpoint_bytes)}`;
$('root').textContent = REPORT.root;
$('partial').hidden = !REPORT.statistics.partial;
$('search').oninput = renderList;
$('list-button').onclick = () => showOverview('list');
$('graph-button').onclick = () => showOverview('graph');
$('include-similar').onchange = () => $('global-graph').querySelector('svg')?.classList.toggle('show-similar', $('include-similar').checked);
$('download').onclick = event => {
  event.preventDefault();
  const url = URL.createObjectURL(new Blob([JSON.stringify(REPORT, null, 2)], {type: 'application/json'}));
  const link = element('a'); link.href = url; link.download = 'run-shelf-report.json'; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
$('back').onclick = () => {
  $('detail').hidden = true; $('overview').hidden = false;
  $('experiment-detail').replaceChildren();
  $(overviewView === 'graph' ? 'graph-button' : 'search').focus({preventScroll: true}); window.scrollTo(0, 0);
};
const noteCount = REPORT.warnings.length;
$('notes-label').textContent = noteCount ? `Scan notes (${noteCount})` : 'Scan notes';
let notesRendered = false;
$('notes').ontoggle = () => {
  if (!$('notes').open || notesRendered) return;
  notesRendered = true;
  const notes = $('scan-notes');
  notes.append(element('p', `Generated ${REPORT.generated_at}. ${REPORT.statistics.checkpoint_candidates} checkpoints have an unknown run. Sources were not modified.`));
  if (!noteCount) notes.append(element('p', 'No file-reading warnings.'));
  for (const warning of REPORT.warnings) {
    const p = element('p', warning.message); p.append(element('div', warning.path, 'path')); notes.append(p);
  }
};
renderList();
</script>
